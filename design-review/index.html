<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Interactive WalletWise mobile product design review in Emerald and Purple."
    />
    <title>WalletWise — Design review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="review-shell">
      <aside class="review-sidebar" aria-label="Design review navigation">
        <div class="review-brand">
          <picture>
            <source id="sidebar-icon-source" srcset="../assets/walletwise-icon-emerald-v1.png" />
            <img
              id="sidebar-icon"
              src="../assets/walletwise-icon-emerald-v1.png"
              alt="WalletWise"
              width="48"
              height="48"
            />
          </picture>
          <div>
            <strong>Wallet<span>Wise</span></strong>
            <small>Mobile design review</small>
          </div>
        </div>

        <label class="screen-search">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
          <span class="sr-only">Search screens</span>
          <input id="screen-search" type="search" placeholder="Find a screen" autocomplete="off" />
        </label>

        <nav id="screen-nav" class="screen-nav"></nav>

        <div class="sidebar-note">
          <span class="material-symbols-rounded" aria-hidden="true">info</span>
          <p>Splits is intentionally separate. Split and loan entries never change spending or budgets.</p>
        </div>
      </aside>

      <main class="review-main">
        <header class="review-toolbar">
          <div>
            <p class="eyebrow">WalletWise · Product direction</p>
            <h1 id="screen-title">Home</h1>
            <p id="screen-description" class="screen-description"></p>
          </div>

          <div class="toolbar-actions">
            <div class="segmented" role="group" aria-label="Preview color scheme">
              <button type="button" data-theme-mode="emerald">
                <span class="theme-dot emerald"></span>Emerald
              </button>
              <button type="button" data-theme-mode="compare" class="is-active">
                <span class="material-symbols-rounded" aria-hidden="true">compare</span>Compare
              </button>
              <button type="button" data-theme-mode="purple">
                <span class="theme-dot purple"></span>Purple
              </button>
            </div>
            <button id="presentation-toggle" class="icon-button presentation-button" type="button" aria-label="Toggle presentation mode">
              <span class="material-symbols-rounded" aria-hidden="true">fullscreen</span>
            </button>
          </div>
        </header>

        <section class="decision-strip" aria-label="Theme decision">
          <div>
            <span class="decision-label">Your saved direction</span>
            <strong id="saved-pick">No theme selected yet</strong>
          </div>
          <div class="decision-buttons">
            <button type="button" class="pick-button pick-emerald" data-pick="emerald">
              Choose Emerald
            </button>
            <button type="button" class="pick-button pick-purple" data-pick="purple">
              Choose Purple
            </button>
          </div>
        </section>

        <section id="preview-stage" class="preview-stage" aria-live="polite"></section>

        <footer class="review-footer">
          <span><kbd>←</kbd><kbd>→</kbd> previous / next screen</span>
          <span><kbd>E</kbd> Emerald · <kbd>C</kbd> Compare · <kbd>P</kbd> Purple</span>
          <span id="screen-count"></span>
        </footer>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
